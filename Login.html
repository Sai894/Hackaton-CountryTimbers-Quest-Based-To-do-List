<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Quest Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-card">
    <h1>Welcome</h1>
    <p>Enter your email to continue your adventure</p>

    <input id="email" type="email" placeholder="you@example.com" />
    <div style="margin-top:10px">
      <button id="continueBtn">Continue</button>
    </div>

    <p id="message" style="color: #f99; margin-top: 12px;"></p>
    <p style="font-size:12px; margin-top:8px; color:#ccc">
      Your progress is stored locally.
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
