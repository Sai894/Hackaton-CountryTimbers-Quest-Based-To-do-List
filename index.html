<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest To-Do Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    XP: <span id="xp">0</span> | 
    LVL: <span id="level">1</span> | 
    <span id="coins">Coins: 0</span>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="dialogBox"></div>

  <button id="logoutBtn" style="position:absolute; top:10px; right:10px;">Logout</button> 
  <button id="shopBtn" style="position:absolute; top:10px; right:100px;">Shop</button>

  <!-- Shop Modal -->
  <div id="shop">
    <h2>Shop</h2>
    <div id="shopItems"></div>
    <button onclick="closeShop()">Close</button>
  </div>

 <script src="quests.js"></script>
  <script src="game.js"></script>

</body>
</html>
